<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proscene · Eos Helper</title>
    <style>
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --border: #2a2f3a;
        --ink: #e8eaed;
        --ink-dim: #9aa3b2;
        --accent: #e0533d;
        --ok: #34d399;
        --warn: #fbbf24;
        --off: #4b5563;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 18px;
        user-select: none;
      }
      h1 { font-size: 16px; margin: 0 0 2px; }
      .sub { color: var(--ink-dim); font-size: 12px; margin: 0 0 16px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      label { display: block; font-size: 12px; color: var(--ink-dim); margin-bottom: 5px; }
      textarea, input {
        width: 100%;
        background: #0c0e12;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--ink);
        padding: 9px 10px;
        font: inherit;
        resize: vertical;
      }
      textarea { min-height: 64px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
      .row { display: flex; gap: 10px; align-items: center; }
      .row > * { flex: 1; }
      .btns { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        border: 1px solid var(--border);
        background: #20242d;
        color: var(--ink);
        border-radius: 8px;
        padding: 9px 10px;
        font: inherit;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: 0.45; cursor: default; }
      .status-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
      .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--off); flex-shrink: 0; }
      .dot.ok { background: var(--ok); }
      .dot.warn { background: var(--warn); }
      .dot.err { background: var(--accent); }
      .status-label { flex: 1; }
      .status-detail { color: var(--ink-dim); font-size: 12px; }
      .cue {
        margin-top: 4px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .cue small { font-size: 13px; font-weight: 400; color: var(--ink-dim); }
      .err-banner { color: var(--accent); font-size: 12px; margin-top: 8px; min-height: 16px; }
      .footer-btns { display: flex; gap: 8px; }
    </style>
  </head>
  <body>
    <h1>Proscene · Eos Helper</h1>
    <p class="sub">Relays the active Eos cue to your Proscene show.</p>

    <div class="card" id="setup">
      <label for="code">Pairing code <span style="color:var(--ink-dim)">(copy from the show’s Follow Eos panel)</span></label>
      <textarea id="code" placeholder="Paste pairing code here…"></textarea>
      <div class="row" style="margin-top: 10px">
        <div>
          <label for="port">Eos OSC port</label>
          <input id="port" type="text" inputmode="numeric" value="8000" />
        </div>
        <div style="flex: 2; align-self: end; color: var(--ink-dim); font-size: 12px">
          Set Eos → Network → OSC UDP TX to this computer’s IP on this port.
        </div>
      </div>
      <div class="btns">
        <button id="start" class="primary">Start</button>
        <button id="stop" disabled>Stop</button>
      </div>
      <div class="err-banner" id="error"></div>
    </div>

    <div class="card">
      <div class="status-row">
        <span class="dot" id="osc-dot"></span>
        <span class="status-label">Eos (OSC)</span>
        <span class="status-detail" id="osc-detail">stopped</span>
      </div>
      <div class="status-row">
        <span class="dot" id="rt-dot"></span>
        <span class="status-label">Proscene (Realtime)</span>
        <span class="status-detail" id="rt-detail">stopped</span>
      </div>
      <div class="cue" id="cue"><small>No cue yet</small></div>
    </div>

    <div class="footer-btns">
      <button id="mock">Send test cues</button>
      <button id="quit">Quit</button>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
